<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fondid -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Faviconid -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Raamaturadar" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Stiilid -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/avasta.css" />

    <title>Raamaturadar | Avasta</title>
  </head>

  <body>
    <!-- NAVIGATSIOON -->
    <header class="site-header">
      <nav class="nav container">
        <a href="/" class="logo">Raamaturadar</a>

        <!-- Mobiilivaate menüü -->
        <button
          type="button"
          class="menu-toggle"
          aria-label="Ava menüü"
          aria-expanded="false"
          aria-controls="mobile-nav"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links">
          <div>
            <a href="/index.html" class="nav-link">Avaleht</a>
          </div>
          <div>
            <a href="/avasta.html" class="nav-link active" aria-current="page"
              >Avasta</a
            >
          </div>
        </div>
      </nav>
    </header>

    <!-- KEHA -->
    <main>
      <div class="container">
        <section>
          <h1>
            Avasta <span style="color: var(--color-accent)">uus</span> raamat
          </h1>
          <div class="card avasta-raamat-filtrid">
            <div>
              <div class="card-title">Žanr:</div>
              <div class="pill-block" data-filter="zanr">
                <button type="button" class="pill pill--selected" data-value="">
                  Kõik žanrid
                </button>
                <button type="button" class="pill" data-value="fiction">
                  Fiction
                </button>
                <button type="button" class="pill" data-value="thrillers">
                  Thrillers
                </button>
                <button type="button" class="pill" data-value="mystery">
                  Mystery
                </button>
                <button type="button" class="pill" data-value="romance">
                  Romance
                </button>
                <button type="button" class="pill" data-value="drama">
                  Drama
                </button>
                <button type="button" class="pill" data-value="fantasy">
                  Fantasy
                </button>
                <button type="button" class="pill" data-value="nonfiction">
                  Non-fiction
                </button>
                <button
                  type="button"
                  class="pill"
                  data-value="historical fiction"
                >
                  Historical Fiction
                </button>
              </div>
            </div>
            <div>
              <div class="card-title">Keel:</div>
              <div class="pill-block" data-filter="keel">
                <button type="button" class="pill pill--selected" data-value="">
                  Kõik keeled
                </button>
                <button type="button" class="pill" data-value="eng">
                  Inglise
                </button>
                <button type="button" class="pill" data-value="est">
                  Eesti
                </button>
                <button type="button" class="pill" data-value="ger">
                  Saksa
                </button>
                <button type="button" class="pill" data-value="fre">
                  Prantsuse
                </button>
                <button type="button" class="pill" data-value="rus">
                  Vene
                </button>
                <button type="button" class="pill" data-value="fin">
                  Soome
                </button>
                <button type="button" class="pill" data-value="ukr">
                  Ukraina
                </button>
              </div>
            </div>
            <div>
              <div class="card-title">Ilmumisaasta:</div>
              <div class="pill-block" data-filter="aasta">
                <button type="button" class="pill pill--selected" data-value="">
                  Kõik aastad
                </button>
                <button type="button" class="pill" data-value="2020-*">
                  2020+
                </button>
                <button type="button" class="pill" data-value="2010-2019">
                  2010-2019
                </button>
                <button type="button" class="pill" data-value="2000-2009">
                  2000-2009
                </button>
                <button type="button" class="pill" data-value="1900-1999">
                  1900-1999
                </button>
              </div>
            </div>
            <div class="avasta-raamat-filtrid-nupud">
              <button type="button" class="pill" id="feeling-lucky">
                Feeling lucky
              </button>
              <button type="button" class="pill pill--filled" id="leia-raamat">
                Leia raamat
              </button>
            </div>
          </div>
        </section>

        <!-- TULEMUS -->
        <section class="avasta-tulemus" id="tulemus" aria-live="polite"></section>
      </div>
    </main>

    <!-- JALUS -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Raamaturadar. Kõik õigused kaitstud.</p>
      </div>
    </footer>

    <!-- Tehisintellekti abi kasutati interaktsioonide loomiseks -->
    <script src="js/keeled.js" defer></script>
    <script src="js/avasta.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // FILTRITE VALIMINE
        document.querySelectorAll(".pill-block").forEach((group) => {
          group.addEventListener("click", (event) => {
            const clickedPill = event.target.closest(".pill");

            if (!clickedPill) return;

            // Eemalda eelmine valik samast grupist
            group.querySelectorAll(".pill").forEach((pill) => {
              pill.classList.remove("pill--selected");
              pill.setAttribute("aria-pressed", "false");
            });

            // Aktiveeri klikitud nupp
            clickedPill.classList.add("pill--selected");
            clickedPill.setAttribute("aria-pressed", "true");
          });
        });

        // MOBIILIMENÜÜ
        const menuToggle = document.querySelector(".menu-toggle");
        const navLinks = document.querySelector(".nav-links");

        if (menuToggle && navLinks) {
          function setMenuOpen(isOpen) {
            menuToggle.classList.toggle("is-open", isOpen);
            navLinks.classList.toggle("is-open", isOpen);

            menuToggle.setAttribute("aria-expanded", String(isOpen));
            menuToggle.setAttribute(
              "aria-label",
              isOpen ? "Sulge menüü" : "Ava menüü",
            );
          }

          menuToggle.addEventListener("click", () => {
            setMenuOpen(!navLinks.classList.contains("is-open"));
          });

          navLinks.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => setMenuOpen(false));
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") setMenuOpen(false);
          });
        }
      });
    </script>
  </body>
</html>
