<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Raamaturadar" />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/avasta.css" />

    <title>Raamaturadar | Avasta</title>
  </head>

  <!-- AI assistance was used to implement basic button interactions. -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".pill-block").forEach((group) => {
        group.addEventListener("click", (event) => {
          const clickedPill = event.target.closest(".pill");

          if (!clickedPill) return;

          // Eemalda eelmine valik samast grupist
          group.querySelectorAll(".pill").forEach((pill) => {
            pill.classList.remove("pill--selected");
            pill.setAttribute("aria-pressed", "false");
          });

          // Aktiveeri klikitud nupp
          clickedPill.classList.add("pill--selected");
          clickedPill.setAttribute("aria-pressed", "true");
        });
      });
    });
  </script>

  <body>
    <!-- NAVIGATION -->
    <header class="site-header">
      <nav class="nav container">
        <a href="/" class="logo">Raamaturadar</a>
        <div class="nav-links">
          <div>
            <a href="/index.html" class="nav-link">Avaleht</a>
          </div>
          <div>
            <a href="/avasta.html" class="nav-link active" aria-current="page"
              >Avasta</a
            >
          </div>
        </div>
      </nav>
    </header>

    <!-- BODY -->
    <main>
      <div class="container">
        <section>
          <h1>
            Avasta <span style="color: var(--color-accent)">uus</span> raamat
          </h1>
          <div class="card avasta-raamat-filtrid">
            <div>
              <div class="card-title">Žanr:</div>
              <div class="pill-block">
                <button type="button" class="pill pill--selected">
                  Kõik žanrid
                </button>
                <button type="button" class="pill">Fiction</button>
                <button type="button" class="pill">Thrillers</button>
                <button type="button" class="pill">Mystery</button>
                <button type="button" class="pill">Romance</button>
                <button type="button" class="pill">Drama</button>
                <button type="button" class="pill">Fantasy</button>
                <button type="button" class="pill">Non-fiction</button>
                <button type="button" class="pill">
                  Historical Fiction Fiction
                </button>
              </div>
            </div>
            <div>
              <div class="card-title">Keel:</div>
              <div class="pill-block">
                <button type="button" class="pill pill--selected">
                  Kõik keeled
                </button>
                <button type="button" class="pill">Inglise</button>
                <button type="button" class="pill">Eesti</button>
                <button type="button" class="pill">Saksa</button>
                <button type="button" class="pill">Prantsuse</button>
                <button type="button" class="pill">Hispaania</button>
              </div>
            </div>
            <div>
              <div class="card-title">Ilmumisaasta:</div>
              <div class="pill-block">
                <button type="button" class="pill pill--selected">
                  Kõik aastad
                </button>
                <button type="button" class="pill">2020+</button>
                <button type="button" class="pill">2010-2019</button>
                <button type="button" class="pill">2000-2009</button>
                <button type="button" class="pill">1900-1999</button>
              </div>
            </div>
            <div class="avasta-raamat-filtrid-nupud">
              <button type="button" class="pill">Feeling lucky</button>
              <button type="button" class="pill pill--filled">
                Leia raamat
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Raamaturadar. Kõik õigused kaitstud.</p>
      </div>
    </footer>
  </body>
</html>
